<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Warp Market</title>
  <meta name="description" content="Provisiones congeladas para toda la tripulación. Hacé tu pedido y recibilo en tu puerta." />
  <meta name="theme-color" content="#0B0E14" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Barra de estado superior, estilo panel de sensores -->
  <div class="sensor-bar" aria-hidden="true"></div>

  <header class="site-header">
    <div class="site-header__inner">
      <button class="brand" id="storeName" type="button" aria-label="Warp Market">
        Warp Market
      </button>
      <p class="tagline" id="tagline"></p>
    </div>
  </header>

  <!-- Botones flotantes: siempre visibles mientras se navega -->
  <div class="fab-stack">
    <a class="fab fab--whatsapp" id="fabWhatsapp" href="#" target="_blank" rel="noopener" aria-label="Consultar por WhatsApp">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
        <path d="M17.5 14.4c-.3-.1-1.7-.9-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.6-2.1-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.1-.6-1.5-.9-2.1-.2-.5-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1.1 2.8 1.2 3c.1.2 2.2 3.4 5.3 4.7.7.3 1.3.5 1.8.7.7.2 1.4.2 1.9.1.6-.1 1.7-.7 1.9-1.3.2-.7.2-1.2.2-1.3-.1-.2-.3-.3-.6-.4z"/>
        <path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/>
      </svg>
    </a>
    <button class="fab fab--cart" id="cartToggle" type="button" aria-label="Abrir carrito">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="9" cy="21" r="1.4" />
        <circle cx="18" cy="21" r="1.4" />
        <path d="M2.5 3h2l2.2 12.2a2 2 0 0 0 2 1.6h8.3a2 2 0 0 0 2-1.6L21 7H6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="cart-toggle__count is-hidden" id="cartCount">0</span>
    </button>
  </div>

  <main>
    <section class="toolbar">
      <div class="toolbar__inner">
        <div class="search-field">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m21 21-4.3-4.3" stroke-linecap="round" />
          </svg>
          <input type="search" id="searchInput" placeholder="Buscar productos…" aria-label="Buscar productos" />
        </div>
        <p class="results-count" id="resultsCount" aria-live="polite"></p>
      </div>
      <nav class="category-rail" id="categoryRail" aria-label="Categorías"></nav>
    </section>

    <section class="catalog">
      <div class="catalog__grid" id="productGrid" aria-live="polite"></div>
    </section>

    <p class="shipping-note is-hidden" id="shippingNote"></p>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> Warp Market — Todos los sistemas operativos.</p>
  </footer>

  <!-- Carrito -->
  <div class="cart-overlay" id="cartOverlay"></div>
  <aside class="cart-drawer" id="cartDrawer" aria-hidden="true" aria-label="Carrito de compras">
    <div class="cart-drawer__header">
      <h2>Tu pedido</h2>
      <button class="cart-close" id="cartClose" aria-label="Cerrar carrito">✕</button>
    </div>

    <ul class="cart-items" id="cartItems"></ul>
    <p class="cart-empty" id="cartEmpty">Tu carrito está vacío por ahora.</p>

    <div class="cart-drawer__footer">
      <div class="cart-total-row">
        <span>Total</span>
        <span class="cart-total" id="cartTotal">$0</span>
      </div>
      <button class="btn btn--primary btn--block" id="checkoutBtn" disabled>
        Pedir por WhatsApp
      </button>
    </div>
  </aside>

  <div class="toast-host" id="toastHost" aria-live="assertive"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/store.js"></script>
</body>
</html>
